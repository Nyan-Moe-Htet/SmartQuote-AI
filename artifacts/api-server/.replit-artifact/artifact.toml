kind = "api"
previewPath = "/"
title = "SmartQuote AI"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 8000
name = "SmartQuote AI"
paths = ["/"]

[services.env]
PORT = "8000"

[services.development]
run = "cd ../.. && exec .pythonlibs/bin/python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
